name: Bug report
description: Report a reproducible bug in the research toolkit
title: "Bug: "
labels: []
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the command, config profile, and sanitized inputs.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Paste sanitized logs only. Do not include secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed API keys, private keys, wallet addresses that should not be public, and generated state dumps.
          required: true
