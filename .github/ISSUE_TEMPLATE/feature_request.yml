name: Feature request
description: Suggest an improvement to tooling, data ingestion, reports, or docs
title: "Feature: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is currently hard or missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation idea
      description: How can maintainers verify that the feature works?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This request is for research, paper trading, data quality, reporting, or documentation.
          required: true
