[package]
name = "polymarket_mvp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "Polymarket bundle-arbitrage bot with paper and live modes"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.0", features = ["derive"] }
chrono = { version = "0.4.44", features = ["serde"] }
crossterm = "0.29.0"
futures-util = "0.3.32"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
rpassword = "7.4.0"
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std"] }
rust_decimal = { version = "1.41.0", features = ["serde-with-str"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
polymarket-client-sdk = { version = "0.4.4", default-features = false, features = ["clob", "tracing"] }

[dev-dependencies]
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
