[http]
gamma_base_url = "https://gamma-api.polymarket.com"
clob_base_url = "https://clob.polymarket.com"
data_api_base_url = "https://data-api.polymarket.com"
geoblock_url = "https://polymarket.com/api/geoblock"
binance_base_url = "https://api.binance.com"
binance_ws_base_url = "wss://stream.binance.com:9443/ws"
coinbase_market_data_enabled = false
coinbase_ws_base_url = "wss://ws-feed.exchange.coinbase.com"
coinbase_max_source_disagreement_bps = "25"
coinbase_max_spread_bps = "5"
timeout_secs = 15
page_size = 200
books_batch_size = 100

[strategy]
market_targets = ["btc-5m", "btc-15m", "eth-5m"]
enable_bundle = true
min_edge_bps = 25
assumed_fee_bps = 0
min_spot_move_bps = 5
min_liquidity_usdc = "5000"
min_top_of_book_shares = "25"
max_bundle_notional_usdc = "50"
max_directional_notional_usdc = "30"
directional_soft_entry_max_notional_usdc = "30"
max_market_notional_usdc = "150"
min_seconds_left = 20
max_seconds_left = 299
min_minutes_to_expiry = 30
max_markets = 200
enable_directional = true
directional_min_spot_move_bps = 12
directional_min_signal_bps = 16
directional_min_velocity_bps_per_minute = 6
directional_min_model_edge_bps = 15
directional_confidence_bps_per_spot_bps = 25
directional_projection_cap_multiplier = "2.0"
directional_trade_flow_weight = "0.35"
directional_micro_signal_weight = "0.50"
enable_micro_breakout = true
micro_breakout_min_spot_move_bps = 3
micro_breakout_min_spot_move_5s_bps = 2
micro_breakout_min_signal_bps = 5
micro_breakout_signal_boost_multiplier = "1.8"
micro_breakout_max_entry_price = "0.90"
enable_codex_sentinel_v1 = false
codex_sentinel_v1_mid_signal_guard_enabled = true
codex_sentinel_v1_mid_signal_min_bps = "2.8"
codex_sentinel_v1_mid_signal_max_bps = "3.6"
codex_sentinel_v1_mid_signal_min_confirmation_bps = "0.05"
codex_sentinel_v1_max_entry_price = "0.76"
codex_sentinel_v1_stale_micro_guard_enabled = true
codex_sentinel_v1_stale_micro_max_confirmation_bps = "0.05"
codex_sentinel_v1_stale_micro_discount_max_entry_price = "0.55"
codex_sentinel_v1_stale_micro_discount_min_signal_bps = "450"
codex_sentinel_v1_stale_micro_discount_min_flow_bps = "700"
codex_sentinel_v1_stale_micro_min_signal_bps = "800"
codex_sentinel_v1_stale_micro_min_flow_bps = "1400"
codex_sentinel_v1_attack_size_enabled = false
codex_sentinel_v1_attack_notional_usdc = "10"
codex_sentinel_v1_attack_min_signal_bps = "650"
codex_sentinel_v1_attack_min_flow_bps = "700"
codex_sentinel_v1_attack_min_confirmation_bps = "0.50"
codex_sentinel_v1_attack_max_entry_price = "0.60"
codex_sentinel_v1_premium_entry_guard_enabled = false
codex_sentinel_v1_premium_entry_price = "0.55"
codex_sentinel_v1_premium_min_signal_bps = "800"
codex_sentinel_v1_premium_min_flow_bps = "1400"
codex_sentinel_v1_premium_min_fresh_bps = "1.25"
codex_sentinel_v1_bad_window_guard_enabled = false
codex_sentinel_v1_bad_window_min_score = "32"
codex_sentinel_v1_confidence_sizing_enabled = false
codex_sentinel_v1_confidence_min_score = "40"
codex_sentinel_v1_confidence_max_multiplier = "1.00"
codex_sentinel_v1_counter_burst_guard_enabled = false
codex_sentinel_v1_counter_burst_min_bps = "0.75"
codex_sentinel_v1_counter_burst_max_entry_price = "0.55"
directional_execution_slippage_bps = 15
directional_max_fair_price = "0.72"
directional_max_entry_price = "0.60"
enable_tail_hedge = true
tail_hedge_ratio = "0.25"
tail_hedge_min_spot_move_bps = 10
tail_hedge_min_signal_bps = 14
tail_hedge_min_velocity_bps_per_minute = 6
tail_hedge_max_opposite_price = "0.25"
tail_hedge_max_bundle_cost = "0.99"
tail_hedge_open_window_secs = 20

[run]
mode = "paper"
poll_interval_secs = 15
# Optional: when set, dashboard will show paper cash/equity in real time.
# paper_starting_balance_usdc = "50"
reactive = false
reactive_debounce_ms = 750
# Set to 0 for fully event-driven mode (waits for Binance triggers indefinitely).
reactive_idle_secs = 15
allow_repeat_entries_same_window = false
execute_top_n = 1

[run.polymarket_stream]
enabled = false
book_staleness_ms = 8000
backfill_trade_flow = true

[run.early_exit]
enabled = true
min_hold_secs = 3
min_take_profit_usdc = "0.75"
min_expected_profit_capture_ratio = "0.55"
max_loss_usdc = "1.50"
reversal_min_5s_bps = "2.0"
near_expiry_secs = 20

[run.adaptive_regime]
enabled = true
aggressive_min_spot_move_bps = 25
aggressive_max_bundle_cost = "1.02"
safe_max_bundle_cost = "0.995"
safe_bundle_only = true
safe_max_entries_per_cycle = 1

[run.pnl_ratchet]
enabled = false
apply_to_codex_sentinel_only = true
base_notional_usdc = "6"
protect_notional_usdc = "4"
profit_unlock_usdc = "2"
protect_after_consecutive_losses = 1

[run.risk]
max_daily_loss_usdc = "30"
max_session_loss_usdc = "50"
max_open_notional_usdc = "50"
max_unrealized_loss_usdc = "10"
max_consecutive_losses = 3
cooldown_cycles = 3
apply_in_live_mode = false
seed_from_history = true
reset_daily_on_start = false

[live]
private_key_env = "POLYMARKET_PRIVATE_KEY"
api_key_env = "POLYMARKET_API_KEY"
api_secret_env = "POLYMARKET_API_SECRET"
api_passphrase_env = "POLYMARKET_API_PASSPHRASE"
prompt_for_secrets = true
signature_type = "proxy"
# Optional override for advanced setups. Usually not needed for proxy/safe because the SDK can derive it.
# funder_address = "0x..."

[polybacktest]
base_url = "https://api.polybacktest.com"
api_key_env = "POLYBACKTEST_API_KEY"
prompt_for_api_key = true
snapshot_page_limit = 250
include_orderbook = true
cache_enabled = true
cache_dir = "state/polybacktest-cache"

[storage]
state_dir = "state"
execution_journal_filename = "trade_journal.jsonl"
pnl_snapshot_filename = "pnl_snapshot.json"
paper_cycle_journal_filename = "paper_cycle_journal.jsonl"
paper_trade_journal_filename = "paper_trade_journal.jsonl"
